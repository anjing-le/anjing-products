<style>
* { box-sizing:border-box }
body { margin:0; color:#282a25; background:#edeae2; font-family:"Helvetica Neue",Arial,sans-serif }
.stage {
  position:relative; isolation:isolate; overflow:hidden; height:100vh; height:100svh;
  display:flex; justify-content:center; align-items:flex-start; gap:clamp(8px,4.3vw,80px);
  background:#e8e4d5 url("assets/marble.webp") center / cover;
  --w:min(24vw,29svh,324px); --strap:min(2.8vw,36px); --metal:linear-gradient(103deg,#393c38 0%,#acaca6 17%,#fafbf2 32%,#676b65 48%,#e1e2d7 69%,#4a4d48 91%);
}
.stage::after { content:""; pointer-events:none; position:absolute; inset:0; box-shadow:inset 0 8px 16px -15px #514b3e; }
.unit { width:var(--w); position:relative; perspective:1100px }
.unit.pulled {z-index:4;animation-play-state:paused}
.rig { padding-top:var(--length); position:absolute; width:100%; top:0; transform-origin:50% 0; will-change:transform }
.strap {
  position:absolute; top:var(--anchor-y); left:0; right:0; width:var(--strap); margin:auto; height:var(--ribbon-length); min-height:3px; transform-origin:50% 0; transform:rotate(var(--pull-angle));
}
.strap > i {position:absolute;left:0;width:100%;transform-origin:50% 0;pointer-events:none;
  background:repeating-linear-gradient(37deg,#ffffff23 0 1px,transparent 1px 3px),repeating-linear-gradient(143deg,#1112 0 1px,transparent 1px 3px),linear-gradient(90deg,var(--edge),var(--fabric) 9% 90%,var(--edge));
  border-inline:1px solid #24282230; background-position:0 var(--weave-y),0 var(--weave-y),0 0;
}
.strap > i:last-child::after { content:""; position:absolute; bottom:2px; left:9%; right:9%; height:4px; border-block:1px dashed #fff5 }
.joint { position:relative; width:100%; display:grid; justify-items:center; transform-origin:50% 0; will-change:transform }
.ring {
  z-index:1; width:calc(var(--strap)*1.25); height:calc(var(--strap)*.58);
  margin-top:-3px; padding:3px; border-radius:6px 6px 44% 44%; background:var(--metal);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
}
.mount {position:relative;width:100%;margin-top:calc(var(--w)*.16)}
.mount::before,.mount::after {
  content:"";position:absolute;pointer-events:none;left:44%;width:12%;
  top:calc(var(--w)*-.179);height:calc(var(--w)*.252);
  background:center / 100% 100% no-repeat;
}
.mount::before {background-image:url("assets/clasp-back.svg")}
.mount::after {background-image:url("assets/clasp-front.svg")}
.badge {
  width:100%; aspect-ratio:.78; position:relative; display:flex; flex-direction:column; align-items:flex-start;
  margin:0;display:block; padding:0; overflow:hidden; appearance:none; color:var(--ink);
  background:var(--stock); border:1px solid #5b5d5129; border-radius:calc(var(--w) * .074);
  box-shadow:inset 1px 1px 1px #fff9,inset -1px -2px 2px #282a261e,2px 3px 1px #77756747,8px 16px 22px -11px #46433555,17px 30px 49px -21px #46433555;
  cursor:grab; touch-action:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
.badge:active {cursor:grabbing}
.badge:focus-visible {outline:3px solid #305d8e; outline-offset:5px}
.name { position:absolute; bottom:4%; left:9%; font-size:calc(var(--w) * .134); font-weight:600; letter-spacing:-.065em; line-height:1; z-index:1 }
.art { position:absolute; top:9%;left:0;width:100%;height:70%;object-fit:cover; overflow:hidden; pointer-events:none }
.mac {--fabric:#687584;--edge:#47525e;--stock:#d9e5f1;--ink:#213348}
.english {--fabric:#aa6750;--edge:#884b39;--stock:#f4d5ba;--ink:#552d28}
.cs {--fabric:#717a60;--edge:#555f48;--stock:#d8ddbe;--ink:#303c2d}
@media(max-width:600px){.stage{--w:min(29vw,27svh);--strap:16px;gap:3vw}.ring{padding:2px}}

.hand {
  --card-width:min(38vw,58svh);
  position:absolute; bottom:5svh; left:50%; transform:translateX(-50%);
  display:flex; align-items:flex-end; justify-content:center; isolation:isolate; pointer-events:none;
}
.hand[hidden] { display:none }
.feature {
  width:var(--card-width); aspect-ratio:1.54; padding:0; border:none; background:transparent;
  position:relative; cursor:pointer; touch-action:none; -webkit-tap-highlight-color:transparent;
}
.feature + .feature { margin-left:calc(var(--card-width) * -.60) }
.face {
  position:absolute; inset:0; display:grid; place-items:center; border-radius:7%;
  color:var(--color); background:linear-gradient(140deg,#fffdf5,var(--tint));
  border:1px solid #706b612b; box-shadow:inset 0 0 0 3px #fff9,1px 2px 1px #645d4b45,3px 8px 15px #50493927;
  transform-origin:50% 90%; transform:translateY(var(--dip)) rotate(var(--tilt));
  transition:transform .25s ease, box-shadow .25s ease; pointer-events:auto;
}
.face::before,.face::after {content:"";position:absolute;width:6%;aspect-ratio:1;background:currentColor;border-radius:35%;transform:rotate(45deg)}
.face::before {top:7%;left:8%}
.face::after {bottom:7%;right:8%}
.feature.show {z-index:2}
.hand.pulling {z-index:5}
.feature.sliding {z-index:3;translate:var(--dx) var(--dy)}
.feature.returning {transition:translate .46s cubic-bezier(.18,.85,.25,1.07)}
@media(prefers-reduced-motion:reduce){.feature.returning{transition:none}}
.feature.show .face {transform:translateY(-3.7svh) rotate(0) scale(1.06);box-shadow:inset 0 0 0 3px #fff9,2px 4px 2px #645d4b38,6px 13px 20px #50493935}
.feature:focus-visible {outline:none}
.feature:focus-visible .face {outline:2px solid currentColor;outline-offset:3px}
.scene {width:96%;height:90%;object-fit:contain;border-radius:6%;pointer-events:none}
.hand.reveal .feature {animation:deal .34s backwards; animation-delay:var(--delay)}
.hand.closing .feature {animation:gather .28s ease-in both}
@keyframes gather {to {transform:translate(var(--gather-x),14svh) scale(.72);opacity:0}}
@keyframes deal {from {opacity:0;transform:translateY(22px) rotate(-5deg)}}
@media(max-width:600px){.hand{--card-width:56vw;bottom:10svh}.feature{aspect-ratio:.82}.feature + .feature{margin-left:calc(var(--card-width) * -.81)}}
@media(prefers-reduced-motion:reduce){.face{transition:none}.hand.reveal .feature,.hand.closing .feature{animation:none}}

.water {position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.unit {transform-origin:50% 0;animation:breeze var(--period,8s) ease-in-out var(--phase,-2s) infinite alternate}
.english {--period:9.6s;--phase:-7s}
.cs {--period:7.3s;--phase:-4s}
@keyframes breeze {0% {rotate:-.9deg} 46% {rotate:.2deg} 100% {rotate:1.1deg}}
.unit:focus-within,.unit:hover {animation-play-state:paused}
.badge {
  mask-image:radial-gradient(ellipse calc(var(--w)*.042) calc(var(--w)*.018) at 50% 5.4%,transparent 91%,#000 99%);
}
.badge::after {
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse calc(var(--w)*.047) calc(var(--w)*.023) at 50% 5.4%,transparent 74%,#332f285c 80%,#f8f3dd96 90%,transparent 100%);
}
.joint {filter:drop-shadow(3px 9px 6px #42515133)}
.art {inset:0;width:100%;height:100%;object-fit:fill}
.badge .name {background:linear-gradient(0deg,var(--stock) 40%,transparent);bottom:0;left:0;right:0;padding:9% 9% 4%;text-align:left}
.badge img {z-index:-1}
.badge {isolation:isolate}
.face {overflow:hidden}
.face::before,.face::after {display:none}
.scene {width:100%;height:100%;object-fit:cover;border-radius:inherit}
.person {position:absolute;top:0;right:3vw;--w:min(10vw,12svh);--strap:calc(var(--w)*.12);--stock:#f4ead8;--ink:#544d44;--fabric:#917c6d;--edge:#715f51;--period:8.7s;--phase:-5s}
.person .badge {background:linear-gradient(140deg,#f6f0e3,#e4d7bf)}
.seal {position:absolute;left:35%;top:27%;width:30%;height:30%;border:1.5px solid #9c8b76;border-radius:50% 50% 45% 45%;transform:rotate(-12deg)}
.seal::after {content:"";position:absolute;inset:17% -21% -9% 25%;border:1px solid #9c8b76;border-radius:50%}
.profile-face {background:linear-gradient(130deg,#faf2e3,var(--tint));color:var(--color)}
.profile-face span {font:500 clamp(18px,3vw,44px)/1.3 Georgia,serif;letter-spacing:.09em}
@media(max-width:780px){.stage{padding-right:14vw;--w:min(24vw,27svh);gap:2.4vw}.person{right:1.8vw;--w:12vw}.person .name{font-size:clamp(9px,2.5vw,14px)}}
@media(max-width:600px){.feature{aspect-ratio:1.26}.scene{object-fit:fill}}
@media(prefers-reduced-motion:reduce){.unit{animation:none}}

.mount {perspective:calc(var(--w) * 4.5)}
.badge-turn {position:relative;width:100%;aspect-ratio:.78;transform-style:preserve-3d;transition:transform .68s cubic-bezier(.32,.02,.18,1)}
/* One animated angle keeps the upper ring, both clasp arms and card in phase. */
@property --hardware-turn {syntax:"<angle>";inherits:true;initial-value:0deg}
.rig {--hardware-turn:0deg;transition:--hardware-turn .68s cubic-bezier(.32,.02,.18,1)}
.turned .rig {--hardware-turn:180deg}
.ring {transform-origin:50% 100%;transform:rotate(var(--ring-angle)) rotateY(var(--hardware-turn))}
.mount::before,.mount::after,.badge-turn {transform:rotateY(var(--hardware-turn))}
.badge-turn {transition:none}
@media(prefers-reduced-motion:reduce){.rig{transition:none}}
.badge-turn .badge {position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;margin:0}
.front {transform:rotateY(0deg)}
.reverse {transform:rotateY(180deg)}
.badge-turn .reverse {background:transparent;border:0;box-shadow:none}
.print {position:absolute;inset:0;background:var(--stock);border:1px solid #45483b38;border-radius:inherit;overflow:hidden}
.back-art {width:100%;height:65%;object-fit:cover;display:block}
.reverse-name {position:absolute;top:65%;left:9%;font-weight:600;font-size:calc(var(--w)*.105);letter-spacing:-.055em}
.personal-print .reverse-name {left:0;right:0;top:43%;text-align:center;font-family:Georgia,serif;font-size:calc(var(--w)*.22)}
.product-print {mask:url("assets/download-cutouts.svg") center/100% 100%}
.badge-toggle {position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;border-radius:calc(var(--w)*.074);background:transparent;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
.badge-toggle:focus-visible {outline:2px solid #536c74;outline-offset:2px}
.platforms {position:absolute;inset:78% 8% 9%;display:flex;justify-content:space-between;opacity:0;pointer-events:none}
.turned .platforms {opacity:1;transition:opacity .16s .46s}
.platforms button {width:46.43%;padding:0;border:1px solid #695f4d40;border-radius:calc(var(--w)*.043);background:transparent;color:var(--ink);font:600 clamp(8px,calc(var(--w)*.059),17px)/1 system-ui;transition:background .16s,box-shadow .16s}
.turned .platforms button {pointer-events:auto}
.platforms button:hover,.platforms button:focus-visible {background:#fff9;box-shadow:inset 0 1px 4px #786d5530}
.unit.person {animation-name:personal-wind;animation-play-state:running}
@keyframes personal-wind {from {rotate:-2.4deg} to {rotate:2.1deg}}
@media(prefers-reduced-motion:reduce){.badge-turn,.turned .platforms{transition:none}.unit.person{animation:none}}
@media(pointer:fine){
body {cursor:url("assets/cursor-arrow-1.png") 4 2,default;cursor:image-set(url("assets/cursor-arrow-1.png") 1x,url("assets/cursor-arrow-2.png") 2x) 4 2,default}

}

}
.person .badge-turn,.person .badge {aspect-ratio:1}
.person .badge.front {border:0;border-radius:19%;background:transparent;box-shadow:none}
.person .portrait {position:absolute;inset:-2%;width:104%;height:104%;display:block;object-fit:cover}
/* macos-x: one continuous printed surface; hardware and depth stay in CSS. */
.mac {--stock:#cbdff0;--ink:#293c4a}

.macos-hand .scene {object-fit:contain}
.art-viewer {width:min(94vw,1400px);max-width:none;max-height:92svh;padding:0;border:1px solid #d9d5c9;border-radius:16px;background:#f8f6f0;color:#3b3b36;box-shadow:0 24px 90px #2227}
.art-viewer::backdrop {background:#242b2a8c;backdrop-filter:blur(5px)}
.viewer-bar {display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;font-size:14px}
.viewer-bar h2 {margin:0;font:inherit;font-weight:600}

.viewer-bar button:hover {background:#e9e5db}
.viewer-image {display:block;width:100%;height:auto}
@media(max-width:600px){.product-hand.macos-hand{--card-width:62vw;bottom:13svh}.macos-hand .feature + .feature{margin-left:calc(var(--card-width)*-.925)}.art-viewer{width:96vw;border-radius:10px}.viewer-bar{padding:6px 12px}}
/* cs-tool-x: reuse README art without stretching or cropping its labels. */

@media(max-width:600px){.product-hand.cs-hand{--card-width:64vw;width:96vw;bottom:8svh;justify-content:flex-start;overflow-x:auto;padding:6svh 2vw 2svh;pointer-events:auto}.cs-hand .feature{flex:0 0 var(--card-width)}.cs-hand .feature + .feature{margin-left:3vw}}
</style>

<script>
const stage = document.querySelector('.stage');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const cards = [...document.querySelectorAll('.unit')].map((unit,index) => ({
  unit, index, rig:unit.querySelector('.rig'), joint:unit.querySelector('.joint'), button:unit.querySelector('.badge-toggle'),
  offsetX:0, speedX:0, length:0, velocity:0, angle:0, spin:0, target:0, restAngle:[-2,1.6,-1.1,1.3][index]
}));
// Sample a flat woven strip. The curve has zero slope at both attachments.
const bandCount=16;
for(const card of cards) {
  const strap=card.unit.querySelector('.strap');
  card.bands=Array.from({length:bandCount},()=>strap.appendChild(document.createElement('i')));
  card.flex=card.flexSpeed=0;
}
function drawRibbon(card,length,bend) {
  if(card.drawnLength===length && card.drawnBend===bend) return;
  card.drawnLength=length;
  card.drawnBend=bend;
  let x=0;
  const step=length/bandCount;
  card.bands.forEach((band,i)=>{
    const t=(i+1)/bandCount;
    const nextX=bend*16*t*t*(1-t)*(1-t);
    const tilt=-Math.atan2(nextX-x,step);
    band.style.height=(Math.hypot(nextX-x,step)+(i+1<bandCount?.55:0))+'px';
    band.style.setProperty('--weave-y',-i*step+'px');
    band.style.transform='translate('+x+'px,'+(i*step)+'px) rotate('+tilt+'rad) rotateY(var(--hardware-turn))';
    x=nextX;
  });
}
let product = null, personalOpen = false;
let frame = 0, lastTime = 0, drag = null;
function positions(card) {
  const height = stage.clientHeight;
  const hardware = card.joint.offsetHeight;
  const high = Math.max(8, Math.min(height * [.115,.10,.12,.032][card.index], height * .47 - hardware));
  const low = high + Math.min(32, height * .032);
  const nameHeight = Math.max(28,card.button.offsetHeight*.21);
  return { high, low, tucked:nameHeight-hardware };
}
function paint(card) {
  const drop=Math.max(0,card.length);
  card.rig.style.setProperty('--length',drop+'px');
  // Aim at the ring's lower hinge so the ribbon and ring form one line
  // while the clasp and badge remain free to swing around that hinge.
  const jointAngle=card.angle*.64;
  const hinge=rotatePoint(0,card.hingeY,jointAngle);
  const dx=card.offsetX+hinge.x, dy=card.length+hinge.y-card.anchorY;
  const direction=-Math.atan2(dx,dy);
  const span=Math.hypot(dx,dy);
  const length=Math.max(0,span-card.ringHeight+2);
  const normalX=span?dy/span:0, normalY=span?-dx/span:0;
  if(card.lastTip && !reduced.matches){
    const sideways=(dx-card.lastTip.x)*normalX+(dy-card.lastTip.y)*normalY;
    card.flex-=sideways*.38;
  }
  card.lastTip={x:dx,y:dy};
  // A fully extended lanyard has less lateral give than a slack one.
  const limit=Math.min(length*.13,32/(1+length/430));
  card.flex=Math.max(-limit,Math.min(limit,card.flex));
  drawRibbon(card,length,card.flex);
  card.rig.style.setProperty('--ribbon-length',length+'px');
  card.rig.style.setProperty('--pull-angle',direction+'rad');
  card.joint.style.setProperty('--ring-angle',(direction-jointAngle*Math.PI/180)+'rad');
  card.rig.style.transform='rotate('+card.angle*.36+'deg)';
  card.joint.style.transform='translate('+card.offsetX+'px,'+Math.min(0,card.length)+'px) rotate('+card.angle*.64+'deg)';
}
function animate(time) {
  const dt = Math.min((time-lastTime)/1000,.025); lastTime=time;
  let active=false;
  for (const c of cards) {
    if(reduced.matches) c.flex=c.flexSpeed=0;
    else {
      c.flexSpeed+=(-185*c.flex-19*c.flexSpeed)*dt;
      c.flex+=c.flexSpeed*dt;
    }
    if(Math.abs(c.flex)+Math.abs(c.flexSpeed)>.06) active=true;
    else c.flex=c.flexSpeed=0;
    if (drag?.card===c) {paint(c);continue;}
    if (reduced.matches) { c.length=c.target; c.angle=c.restAngle; c.offsetX=c.speedX=c.velocity=c.spin=0; }
    else {
      c.speedX += (-c.offsetX*118-c.speedX*15)*dt;
      c.offsetX += c.speedX*dt;
      c.velocity += ((c.target-c.length)*118-c.velocity*15)*dt;
      c.length += c.velocity*dt;
      c.spin += ((c.restAngle-c.angle)*48-c.spin*5)*dt;
      c.angle += c.spin*dt;
    }
    if (Math.abs(c.offsetX)+Math.abs(c.speedX)+Math.abs(c.target-c.length)+Math.abs(c.velocity)+Math.abs(c.restAngle-c.angle)+Math.abs(c.spin)>.055) active=true;
    else { c.length=c.target; c.angle=c.restAngle; c.offsetX=c.speedX=c.spin=c.velocity=0; c.unit.classList.remove('pulled'); }
    paint(c);
  }
  frame=active?requestAnimationFrame(animate):0;
}
function wake() { if(!frame) {lastTime=performance.now();frame=requestAnimationFrame(animate)} }
function layout(initial=false) {
  for (const c of cards) {
    const {high,low,tucked}=positions(c);
    const personal=c.unit.classList.contains('person');
    const down=personal?personalOpen:product===c.index;
    const tuckedAway=!personal && !down && (personalOpen || product!==null);
    const target=down?low:tuckedAway?tucked:high;
    if (!initial && Math.abs(c.target-target)>1) c.spin += [17,-20,15,-13][c.index];
    c.target=target;
    c.button.setAttribute('aria-expanded',String(down));
    c.unit.classList.toggle('turned',down);
    const platforms=c.unit.querySelector('.platforms');
    if(platforms) platforms.inert=!down;
    const ring=c.joint.querySelector('.ring');
    const ringStyle=getComputedStyle(ring);
    c.ringHeight=parseFloat(ringStyle.height);
    c.hingeY=c.ringHeight+parseFloat(ringStyle.marginTop);
    c.anchorY=-Math.max(24,ring.offsetWidth);
    c.rig.style.setProperty('--anchor-y',c.anchorY+'px');
    if(initial) { c.length=target;c.angle=c.restAngle;paint(c); }
  }
  wake();
}
function setOpen(card, open) {
  if(card.unit.classList.contains('person')) {
    personalOpen=open;
    if(open && product!==null) {
      product=null;
      showProductHand(null);
    }
    showPersonalHand(open?card.index:null);
  } else {
    product=open?card.index:null;
    showProductHand(product);
  }
  stage.classList.toggle('both-open',personalOpen && product!==null);
  layout();
}
function activate(card) {
  setOpen(card,card.button.getAttribute('aria-expanded')!=='true');
}

function handRenderer(hand) {
  function highlight(button) {
    for(const card of hand.children) card.classList.toggle('show',card===button);
  }
  let held=null;
  hand.onpointerdown=event=>{
    const button=event.target.closest('.feature');
    if(!button || held || !event.isPrimary || event.button!==0) return;
    const translation=getComputedStyle(button).translate;
    const [dx=0,dy=0]=translation==='none'?[]:translation.split(' ').map(parseFloat);
    held={button,id:event.pointerId,x:event.clientX,y:event.clientY,dx,dy,moved:false};
    button.setPointerCapture(event.pointerId);
  };
  hand.onpointermove=event=>{
    if(held){
      if(event.pointerId!==held.id) return;
      const dx=event.clientX-held.x, dy=event.clientY-held.y;
      if(!held.moved && Math.hypot(dx,dy)<6) return;
      const button=held.button;
      if(!held.moved){
        held.moved=true;
        const face=button.querySelector('.face');
        face.style.transform=getComputedStyle(face).transform;
        hand.classList.add('pulling');
        button.classList.remove('returning');
        button.classList.add('sliding');
        highlight(button);
      }
      button.style.setProperty('--dx',held.dx+dx+'px');
      button.style.setProperty('--dy',held.dy+dy+'px');
      return;
    }
    if(event.pointerType==='touch') return;
    const face=event.target.closest('.face');
    if(face) highlight(face.closest('.feature'));
  };
  function dropFeature(event){
    if(!held || held.id!==event.pointerId) return;
    const {button,moved}=held;
    held=null;
    if(!moved) return;
    button.querySelector('.face').style.removeProperty('transform');
    button.classList.add('returning');
    button.style.setProperty('--dx','0px');
    button.style.setProperty('--dy','0px');
    const clean=()=>{
      if(held?.button===button || !button.classList.contains('returning')) return;
      button.classList.remove('sliding','returning');
      if(!hand.querySelector('.sliding')) hand.classList.remove('pulling');
    };
    Promise.allSettled(button.getAnimations().filter(a=>a.transitionProperty==='translate').map(a=>a.finished)).then(clean);
    if(event.type==='pointerup') button.addEventListener('click',e=>{e.stopImmediatePropagation();e.preventDefault()},{capture:true,once:true,signal:AbortSignal.timeout(400)});
  }
  hand.onpointerup=hand.onpointercancel=hand.onlostpointercapture=dropFeature;
  hand.onpointerleave=()=>!held && highlight(hand.contains(document.activeElement) && document.activeElement.matches(':focus-visible') ? document.activeElement : null);
  let closeTimer;
  return function renderHand(selection) {
    clearTimeout(closeTimer);
    held=null;
    hand.classList.remove('pulling');
    if(selection===null) {
      hand.inert=true;
      highlight(null);
      hand.classList.add('closing');
      const finish=()=>{hand.hidden=true;hand.replaceChildren()};
      if(reduced.matches) finish();
      else closeTimer=setTimeout(finish,280);
      return;
    }
    hand.inert=false;
    hand.classList.remove('closing');
    hand.replaceChildren();
    hand.hidden=false;
    hand.classList.toggle('macos-hand',selection===0);
    hand.classList.toggle('cs-hand',selection===2);
    const pack=features[selection];
    hand.setAttribute('aria-label',cards[selection].button.getAttribute('aria-label')+' 功能牌');
    pack.forEach(([label,color,tint],i)=>{
      const button=document.createElement('button');
      button.className='feature';
      button.setAttribute('aria-label',label);
      const offset=i-(pack.length-1)/2;
      button.style.setProperty('--gather-x',(-offset*35)+'%');
      button.style.setProperty('--tilt',offset*(selection===0?2.4:3)+'deg');
      button.style.setProperty('--dip',Math.abs(offset)*.9+'svh');
      button.style.setProperty('--delay',i*30+'ms');
      button.style.setProperty('--color',color);
      button.style.setProperty('--tint',tint);
      const face=document.createElement('span');
      face.className='face';
      if(selection===3) {
        face.classList.add('profile-face');
        const topic=document.createElement('span');
        topic.textContent=label;
        face.append(topic);
      } else {
        const picture=document.createElement('img');
      picture.className='scene';
      picture.alt='';
      picture.draggable=false;
      picture.src=selection===0?'assets/macos-x/'+macosArtwork[i][0]+'.webp':selection===2?'assets/cs-tool-x/'+csArtwork[i][0]+'.webp':'assets/'+productAssets[selection]+'-'+(i+1)+'.webp';
      picture.alt=selection===0?macosArtwork[i][1]:selection===2?csArtwork[i][1]:'';
      picture.loading='lazy';
        face.append(picture);
      }
      button.append(face);
      button.onfocus=()=>highlight(button);
      button.onblur=()=>highlight(null);
      button.onclick=()=>{highlight(button);if(selection===0||selection===2)viewArtwork(selection,i)};
      hand.append(button);
    });
    hand.classList.add('reveal');
  };
}
const showProductHand=handRenderer(document.querySelector(".product-hand"));
const showPersonalHand=handRenderer(document.querySelector(".personal-hand"));
function rotatePoint(x,y,degrees) {
  const a=degrees*Math.PI/180;
  return {x:x*Math.cos(a)-y*Math.sin(a),y:x*Math.sin(a)+y*Math.cos(a)};
}
for(const c of cards) {
  c.button.onclick=()=>activate(c);
  c.button.onpointerdown=e=>{
    if(!e.isPrimary||e.button!==0||drag) return;
    c.unit.classList.add('pulled');
    const bounds=c.unit.getBoundingClientRect();
    const anchorX=bounds.left+bounds.width/2, anchorY=bounds.top+bounds.height/2;
    const breeze=parseFloat(getComputedStyle(c.unit).rotate)||0;
    const pointer=rotatePoint(e.clientX-anchorX,e.clientY-anchorY,-breeze);
    const pivot=rotatePoint(c.offsetX,c.length,c.angle*.36);
    const grip=rotatePoint(pointer.x-pivot.x,pointer.y-pivot.y,-c.angle);
    drag={id:e.pointerId,card:c,x:e.clientX,y:e.clientY,anchorX,anchorY,breeze,grip,startAngle:c.angle,moved:false};
    c.button.setPointerCapture(e.pointerId);
  };
  c.button.onpointermove=e=>{
    if(drag?.id!==e.pointerId||drag.card!==c) return;
    const dy=e.clientY-drag.y, dx=e.clientX-drag.x;
    if(!drag.moved && Math.hypot(dx,dy)<6) return;
    drag.moved=true;
    c.angle=drag.startAngle-Math.max(-5,Math.min(5,dx*.035));
    const pointer=rotatePoint(e.clientX-drag.anchorX,e.clientY-drag.anchorY,-drag.breeze);
    const grip=rotatePoint(drag.grip.x,drag.grip.y,c.angle);
    const pivot=rotatePoint(pointer.x-grip.x,pointer.y-grip.y,-c.angle*.36);
    c.offsetX=pivot.x;
    c.length=pivot.y;
    c.speedX=c.velocity=c.spin=0;
    paint(c);
    wake();
  };
  function release(e) {
    if(drag?.id!==e.pointerId||drag.card!==c) return;
    const moved=drag.moved, distance=e.clientY-drag.y;
    drag=null;
    if(moved && e.type==='pointerup') {
      c.button.addEventListener('click',ev=>{ev.stopImmediatePropagation();ev.preventDefault()},{once:true,capture:true,signal:AbortSignal.timeout(450)});
      if(distance>18) activate(c);
      else if(distance< -18 && c.button.getAttribute('aria-expanded')==='true') setOpen(c,false);
    }
    wake();
  }
  c.button.onpointerup=release;
  c.button.onpointercancel=release;
}
layout(true);
new ResizeObserver(()=>layout()).observe(stage);
